# SwiftRemit alerting rules.
#
# SR-104 — a custodial payments platform has to alert on the conditions that mean
# money is stuck, not just on generic service health. Every rule below carries:
#
#   severity: critical  → pages on-call immediately (money is stuck or at risk)
#   severity: warning   → ticket during business hours (degradation, not loss)
#
#   team:        routing key for Alertmanager (payments | platform | backend)
#   runbook_url: a section that must exist in docs/RUNBOOK.md — enforced in CI by
#                scripts/check-alert-runbooks.js
#
# Loaded by Prometheus via rule_files in backend/monitoring/prometheus.yml, next
# to slo.yml (SLO and error-budget burn rules).

groups:
  # ── Money is stuck ──────────────────────────────────────────────────────────
  - name: swiftremit-funds-at-risk
    rules:
      - alert: SwiftRemitContractPaused
        expr: swiftremit_contract_paused == 1
        for: 1m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "SwiftRemit contract is paused — no remittance can settle"
          description: >
            The on-chain circuit breaker is engaged. Every in-flight remittance is
            frozen until the contract is unpaused. Confirm the pause was intentional,
            then follow the vote-to-unpause quorum procedure.
          runbook_url: "docs/RUNBOOK.md#2-circuit-breaker-multi-admin-vote-to-unpause"

      - alert: SwiftRemitOldestPendingRemittanceStuck
        expr: swiftremit_oldest_pending_remittance_age_seconds > 3600
        for: 10m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "A remittance has been pending for over an hour"
          description: >
            The oldest non-terminal remittance is {{ $value | humanizeDuration }} old.
            Sender funds are held in escrow and the recipient has not been paid.
          runbook_url: "docs/RUNBOOK.md#12-remittance-stuck-in-a-non-terminal-state"

      - alert: SwiftRemitOldestPendingRemittanceStuckWarning
        expr: swiftremit_oldest_pending_remittance_age_seconds > 1800
        for: 10m
        labels:
          severity: warning
          team: payments
        annotations:
          summary: "A remittance has been pending for over 30 minutes"
          description: >
            The oldest non-terminal remittance is {{ $value | humanizeDuration }} old,
            past the 15-minute settlement objective. Check the anchor and the
            on-chain state before it escalates.
          runbook_url: "docs/RUNBOOK.md#12-remittance-stuck-in-a-non-terminal-state"

      - alert: SwiftRemitStateDivergence
        expr: reconciler_consecutive_divergent_cycles >= 3
        for: 5m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "Database and on-chain state have diverged for {{ $value }} cycles"
          description: >
            The reconciler has found unrepaired divergence between the database and the
            contract in {{ $value }} consecutive cycles. Balances shown to users may be
            wrong. Do not process refunds until this is resolved.
          runbook_url: "docs/RUNBOOK.md#13-on-chain-state-divergence"

      - alert: SwiftRemitReconcilerStalled
        expr: time() - reconciler_last_run_timestamp_seconds > 3600
        for: 5m
        labels:
          severity: warning
          team: payments
        annotations:
          summary: "The on-chain reconciler has not run in over an hour"
          description: >
            Last reconciliation was {{ $value | humanizeDuration }} ago. Divergence
            between the database and the chain would currently go undetected.
          runbook_url: "docs/RUNBOOK.md#13-on-chain-state-divergence"

  # ── Dependencies degraded ───────────────────────────────────────────────────
  - name: swiftremit-dependencies
    rules:
      - alert: SwiftRemitAnchorCircuitOpen
        expr: max by (anchor_id) (swiftremit_anchor_availability{status="offline"}) == 1
        for: 5m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "Anchor {{ $labels.anchor_id }} is offline — payouts to it are shed"
          description: >
            Health probes to anchor {{ $labels.anchor_id }} have failed for 5 minutes.
            Remittances routed to this anchor cannot complete and will age into the
            stuck-remittance alert.
          runbook_url: "docs/RUNBOOK.md#14-anchor-unavailable-or-circuit-open"

      - alert: SwiftRemitAnchorDegraded
        expr: max by (anchor_id) (swiftremit_anchor_availability{status="degraded"}) == 1
        for: 15m
        labels:
          severity: warning
          team: payments
        annotations:
          summary: "Anchor {{ $labels.anchor_id }} is degraded"
          description: >
            Anchor {{ $labels.anchor_id }} is responding slowly (>5s). Settlement times
            for this corridor will drift past the SLO.
          runbook_url: "docs/RUNBOOK.md#14-anchor-unavailable-or-circuit-open"

      - alert: SwiftRemitFxProviderCircuitOpen
        expr: swiftremit_circuit_open{provider="fx"} == 1
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "FX provider circuit breaker is open"
          description: >
            The primary FX provider has been failing and its circuit is open; quotes are
            being served by the secondary provider or from stale cache.
          runbook_url: "docs/RUNBOOK.md#15-fx-rates-stale-or-provider-circuit-open"

      - alert: SwiftRemitFxRateStale
        expr: max(fx_rate_age_seconds) > 900
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "FX rates are more than 15 minutes stale"
          description: >
            The freshest cached FX rate is {{ $value | humanizeDuration }} old. Quoting a
            remittance on a stale rate loses money on every transaction.
          runbook_url: "docs/RUNBOOK.md#15-fx-rates-stale-or-provider-circuit-open"

      - alert: SwiftRemitFxRateStaleWarning
        expr: max(fx_rate_age_seconds) > 300
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "FX rates are more than 5 minutes stale"
          description: >
            The freshest cached FX rate is {{ $value | humanizeDuration }} old. The
            provider may be rate-limiting or down.
          runbook_url: "docs/RUNBOOK.md#15-fx-rates-stale-or-provider-circuit-open"

  # ── Delivery and background work ────────────────────────────────────────────
  - name: swiftremit-delivery
    rules:
      - alert: SwiftRemitDeadLetterQueueGrowing
        expr: swiftremit_webhook_dead_letter_count > 10
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Webhook dead-letter queue holds {{ $value }} undelivered events"
          description: >
            Subscribers are consistently rejecting deliveries. Partners are not being
            told about settlements they need to act on.
          runbook_url: "docs/RUNBOOK.md#6-replay-failed-webhook-deliveries"

      - alert: SwiftRemitDeadLetterQueueCritical
        expr: swiftremit_webhook_dead_letter_count > 50
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Webhook dead-letter queue is critically deep ({{ $value }} events)"
          description: >
            More than 50 deliveries have exhausted their retries. Replay them once the
            receiving endpoints are healthy.
          runbook_url: "docs/RUNBOOK.md#6-replay-failed-webhook-deliveries"

      - alert: SwiftRemitWebhookDeliveryFailureRateHigh
        expr: |
          sum(rate(swiftremit_webhook_deliveries_total{result=~"failed|error"}[10m]))
          /
          clamp_min(sum(rate(swiftremit_webhook_deliveries_total[10m])), 0.001) > 0.10
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Webhook delivery failure rate is above 10%"
          description: >
            More than 10% of webhook deliveries have failed for 10 minutes. Check
            receiver endpoints, delivery queues and retry behaviour.
          runbook_url: "docs/RUNBOOK.md#6-replay-failed-webhook-deliveries"

      - alert: SwiftRemitKycPollFailureRateHigh
        expr: |
          rate(swiftremit_kyc_poll_failures_total[5m])
          /
          clamp_min(rate(swiftremit_kyc_poll_runs_total[5m]), 0.001) > 0.20
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "KYC poll failure rate is above 20%"
          description: >
            KYC polling is failing for more than a fifth of cycles. Investigate anchor
            availability, connectivity or KYC API throttling.
          runbook_url: "docs/RUNBOOK.md#16-background-job-failing-or-stalled"

      - alert: SwiftRemitKycPollerLag
        expr: time() - kyc_poller_last_run_timestamp_seconds > 1800
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "KYC poller has not run in over 30 minutes"
          description: >
            The KYC status poller last ran {{ $value | humanizeDuration }} ago against an
            expected 30-minute interval. KYC approvals are going stale.
          runbook_url: "docs/RUNBOOK.md#16-background-job-failing-or-stalled"

      - alert: SwiftRemitKycPollerDown
        expr: time() - kyc_poller_last_run_timestamp_seconds > 3600
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "KYC poller has been silent for over an hour"
          description: >
            The KYC status poller has not completed a cycle in over an hour. Senders
            whose KYC has been approved cannot transact.
          runbook_url: "docs/RUNBOOK.md#16-background-job-failing-or-stalled"

      - alert: SwiftRemitBackgroundJobStalled
        expr: time() - max by (job_name) (swiftremit_job_last_run_timestamp) > 7200
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Background job {{ $labels.job_name }} has not run in 2 hours"
          description: >
            {{ $labels.job_name }} last completed {{ $value | humanizeDuration }} ago.
            The scheduler may have crashed.
          runbook_url: "docs/RUNBOOK.md#16-background-job-failing-or-stalled"

  # ── Infrastructure ──────────────────────────────────────────────────────────
  - name: swiftremit-infrastructure
    rules:
      - alert: SwiftRemitMigrationFailed
        expr: swiftremit_failed_migrations > 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "{{ $value }} database migration(s) are recorded as failed"
          description: >
            A migration did not apply cleanly. The schema is in an unknown state and the
            service may be reading or writing the wrong shape of data.
          runbook_url: "docs/RUNBOOK.md#5-handle-a-stuck-migration"

      - alert: SwiftRemitDbPoolSaturated
        expr: >
          db_pool_waiting_connections > 0
          and
          db_pool_idle_connections == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "PostgreSQL connection pool is saturated"
          description: >
            {{ $value }} request(s) are queued with no idle connections available. New
            requests will time out. Look for connection leaks or long-running queries.
          runbook_url: "docs/RUNBOOK.md#17-database-connection-pool-saturation"

      - alert: SwiftRemitDbPoolNearlyExhausted
        expr: db_pool_idle_connections < 3
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PostgreSQL connection pool is nearly exhausted"
          description: >
            Only {{ $value }} idle connections remain. Sustained load at this level will
            start failing requests.
          runbook_url: "docs/RUNBOOK.md#17-database-connection-pool-saturation"

      - alert: SwiftRemitContractEventIndexerLag
        expr: contract_event_indexer_lag_ledgers > 100
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Contract event indexer is {{ $value }} ledgers behind"
          description: >
            Indexed on-chain state is lagging. Settlement confirmations will be delayed
            and the reconciler may report false divergence.
          runbook_url: "docs/RUNBOOK.md#13-on-chain-state-divergence"

      - alert: SwiftRemitAccumulatedFeesThresholdExceeded
        expr: swiftremit_accumulated_fees > 1000000
        for: 15m
        labels:
          severity: warning
          team: payments
        annotations:
          summary: "Accumulated fees exceed the configured threshold"
          description: >
            Undistributed fees have passed the safe threshold. Review fee accounting and
            sweep the treasury.
          runbook_url: "docs/RUNBOOK.md#18-accumulated-fees-above-threshold"
