{{/*
SR-214 — Alertmanager for the Helm-based environments.

Prometheus rules carry a `team:` label (payments | platform | backend); this
deployment routes each team to its on-call receiver using the same
monitoring/alertmanager.yml config the Docker Compose stack uses (kept in sync as
charts/swiftremit/files/alertmanager.yml — CI diffs the two).

Notifier credentials come from an existing Secret (alertmanager.secretName) or,
if you let the chart create one, from alertmanager.secrets.* — either way they
are mounted at /etc/alertmanager/secrets/ and read lazily, so the pod starts
even when they are unset.

Disabled by default. See docs/DEPLOYMENT.md for which deployment mechanism is
authoritative today.
*/}}
{{- if .Values.alertmanager.enabled }}
{{- $am := .Values.alertmanager }}
{{- $createSecret := and (not $am.secretName) $am.secrets }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "swiftremit.fullname" . }}-alertmanager
  labels:
    {{- include "swiftremit.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
data:
  alertmanager.yml: |-
{{ .Files.Get "files/alertmanager.yml" | indent 4 }}
{{- if $createSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swiftremit.fullname" . }}-alertmanager
  labels:
    {{- include "swiftremit.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
type: Opaque
stringData:
  slack_api_url: {{ default "" $am.secrets.slackApiUrl | quote }}
  pagerduty_routing_key: {{ default "" $am.secrets.pagerdutyRoutingKey | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "swiftremit.fullname" . }}-alertmanager
  labels:
    {{- include "swiftremit.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
spec:
  type: ClusterIP
  ports:
    - port: {{ $am.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "swiftremit.selectorLabels" (merge (dict "component" "alertmanager") .) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swiftremit.fullname" . }}-alertmanager
  labels:
    {{- include "swiftremit.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "swiftremit.selectorLabels" (merge (dict "component" "alertmanager") .) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ .Files.Get "files/alertmanager.yml" | sha256sum }}
      labels:
        {{- include "swiftremit.selectorLabels" (merge (dict "component" "alertmanager") .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: alertmanager
          # Third-party image — pulled straight from its upstream repo, not
          # prefixed with global.imageRegistry (override alertmanager.image.*
          # wholesale for an air-gapped registry).
          image: "{{ $am.image.repository }}:{{ $am.image.tag }}"
          imagePullPolicy: {{ $am.image.pullPolicy }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $am.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: secrets
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: storage
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: {{ include "swiftremit.fullname" . }}-alertmanager
        - name: secrets
          secret:
            secretName: {{ default (printf "%s-alertmanager" (include "swiftremit.fullname" .)) $am.secretName }}
            optional: true
        - name: storage
          emptyDir: {}
{{- end }}
