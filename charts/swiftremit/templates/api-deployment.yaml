{{- $svc := .Values.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swiftremit.fullname" . }}-api
  labels:
    {{- include "swiftremit.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "swiftremit.selectorLabels" (merge (dict "component" "api") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swiftremit.selectorLabels" (merge (dict "component" "api") .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml (default .Values.podSecurityContext $svc.podSecurityContext) | nindent 8 }}
      containers:
        - name: api
          image: {{ include "swiftremit.image" (dict "global" .Values.global "image" $svc.image) }}
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "swiftremit.fullname" . }}-api
            - secretRef:
                name: {{ include "swiftremit.fullname" . }}-api
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $svc.service.targetPort }}
            initialDelaySeconds: {{ $svc.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $svc.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $svc.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ $svc.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $svc.service.targetPort }}
            initialDelaySeconds: {{ $svc.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $svc.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $svc.readinessProbe.timeoutSeconds }}
            successThreshold: {{ $svc.readinessProbe.successThreshold }}
            failureThreshold: {{ $svc.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            {{- toYaml (default .Values.containerSecurityContext $svc.containerSecurityContext) | nindent 12 }}
          {{- with $svc.writableVolumes }}
          volumeMounts:
            {{- range . }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
          {{- end }}
      {{- with $svc.writableVolumes }}
      volumes:
        {{- range . }}
        - name: {{ .name }}
          emptyDir: {}
        {{- end }}
      {{- end }}
