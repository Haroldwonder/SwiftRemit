openapi: 3.0.0
info:
  title: SwiftRemit API Service
  version: 1.0.0
  description: |
    API service for SwiftRemit currency configuration and anchor management
    
    ## Rate Limiting
    
    All API endpoints are subject to rate limiting to ensure fair usage and system stability.
    The API implements RFC 6585-compliant rate limiting with the following tiers:
    
    ### Rate Limit Tiers
    
    | Tier      | Limit                | Window    | Applies To                          |
    |-----------|----------------------|-----------|-------------------------------------|
    | **Global**   | 100 requests         | 15 minutes| All unauthenticated requests        |
    | **Per-Key**  | 200 requests         | 1 minute  | Authenticated API key requests      |
    | **Admin**    | 500 requests         | 1 minute  | Admin operations (x-api-key header) |
    | **Webhook**  | 1000 requests        | 1 minute  | Webhook endpoints                   |
    
    ### Rate Limit Headers
    
    Every response includes the following RFC 6585-compliant headers:
    
    - `RateLimit-Limit`: Maximum number of requests allowed in the current window
    - `RateLimit-Remaining`: Number of requests remaining in the current window
    - `RateLimit-Reset`: ISO 8601 timestamp when the rate limit window resets
    
    When the rate limit is exceeded, the API returns:
    
    - HTTP Status: `429 Too Many Requests`
    - `Retry-After` header: Number of seconds to wait before retrying
    - Response body includes `retryAfter` (seconds) and `resetAt` (ISO 8601 timestamp)
    
    ### Example Response Headers
    
    **Successful Request (200 OK):**
    ```
    RateLimit-Limit: 100
    RateLimit-Remaining: 87
    RateLimit-Reset: 2026-07-30T12:30:00.000Z
    ```
    
    **Rate Limit Exceeded (429 Too Many Requests):**
    ```
    RateLimit-Limit: 100
    RateLimit-Remaining: 0
    RateLimit-Reset: 2026-07-30T12:30:00.000Z
    Retry-After: 120
    ```
    
    ### Best Practices
    
    1. **Monitor Headers**: Check `RateLimit-Remaining` before making additional requests
    2. **Honor Retry-After**: When receiving a 429 response, wait at least `Retry-After` seconds
    3. **Implement Exponential Backoff**: For transient errors, use exponential backoff with jitter
    4. **Use API Keys**: Authenticate with `x-api-key` header for higher rate limits
    
  contact:
    name: SwiftRemit Team

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.swiftremit.com
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Currencies
    description: Currency configuration endpoints
  - name: Anchors
    description: Anchor provider management endpoints
  - name: Remittances
    description: Remittance query endpoints
  - name: Admin
    description: Admin utility endpoints
  - name: Agents
    description: Agent registration and management endpoints
  - name: Auth
    description: JWT authentication endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/currencies:
    get:
      tags:
        - Currencies
      summary: Get all supported currencies
      description: Returns all supported currencies with their formatting rules
      operationId: getCurrencies
      responses:
        '200':
          description: List of currencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/currencies/{code}:
    get:
      tags:
        - Currencies
      summary: Get currency by code
      description: Returns a specific currency by its code
      operationId: getCurrencyByCode
      parameters:
        - name: code
          in: path
          required: true
          description: Currency code (e.g., USD, EUR)
          schema:
            type: string
            minLength: 1
            maxLength: 12
            example: USD
      responses:
        '200':
          description: Currency details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyResponse'
        '400':
          description: Invalid currency code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Currency not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/anchors:
    get:
      tags:
        - Anchors
      summary: Get all anchor providers
      description: Returns all available anchor providers with optional filtering
      operationId: getAnchors
      parameters:
        - name: status
          in: query
          description: Filter by anchor status
          schema:
            type: string
            enum: [active, inactive, maintenance]
        - name: currency
          in: query
          description: Filter by supported currency
          schema:
            type: string
            maxLength: 12
      responses:
        '200':
          description: List of anchor providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorListResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/anchors/{id}:
    get:
      tags:
        - Anchors
      summary: Get anchor by ID
      description: Returns a specific anchor provider by ID
      operationId: getAnchorById
      parameters:
        - name: id
          in: path
          required: true
          description: Anchor ID
          schema:
            type: string
      responses:
        '200':
          description: Anchor details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorDetailResponse'
        '404':
          description: Anchor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/anchors/admin:
    post:
      tags:
        - Anchors
      summary: Create new anchor (Admin)
      description: Creates a new anchor provider. Requires admin API key.
      operationId: createAnchor
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnchorProvider'
      responses:
        '201':
          description: Anchor created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorDetailResponse'
        '400':
          description: Invalid anchor payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/remittances:
    get:
      tags:
        - Remittances
      summary: Query remittances with cursor pagination and filters
      description: >
        Returns a cursor-paginated list of remittances with optional filtering
        by status, date range, corridor, and amount range (Issue #882).
      operationId: getRemittances
      parameters:
        - name: agent
          in: query
          required: false
          description: Stellar address of the agent
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by remittance status
          schema:
            type: string
            enum: [Pending, Processing, Completed, Cancelled, Failed, Disputed]
        - name: from_date
          in: query
          required: false
          description: ISO 8601 lower bound for created_at
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          required: false
          description: ISO 8601 upper bound for created_at
          schema:
            type: string
            format: date-time
        - name: corridor
          in: query
          required: false
          description: Corridor filter, e.g. "USD-NG"
          schema:
            type: string
        - name: min_amount
          in: query
          required: false
          description: Minimum amount in stroops
          schema:
            type: integer
            minimum: 0
        - name: max_amount
          in: query
          required: false
          description: Maximum amount in stroops
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from previous response
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Items per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Cursor-paginated list of remittances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemittanceCursorResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/remittances/{id}/status:
    patch:
      tags:
        - Remittances
      summary: Transition a remittance status
      description: Updates a remittance through the server-side status state machine. Requires an agent or admin JWT.
      operationId: updateRemittanceStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, webhook_endpoint]
              properties:
                status:
                  type: string
                  enum: [Pending, Processing, Completed, Cancelled, Failed, Disputed]
                webhook_endpoint:
                  type: string
                  format: uri
      responses:
        '200':
          description: Status transitioned successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Remittance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/agents:
    post:
      tags:
        - Agents
      summary: Register a new agent (Issue #880)
      description: >
        Creates an agent profile with status 'pending'. Requires admin authentication:
        either an admin API key (x-api-key header) or an admin-role JWT. Agent-role
        JWTs are not accepted. The on-chain register_agent call should be triggered
        separately.
