name: Mobile CI

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  # SR-212: nightly verification that the most recent EAS build for each
  # platform actually completed successfully, independent of PR-time runs.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch to save minutes.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

# ─────────────────────────────────────────────────────────────────────────────
# Shared setup step — reused by all Node jobs
# ─────────────────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Install & lint
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Cache based on the lockfile so the cache is invalidated when deps change.
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci is deterministic and respects the lockfile exactly.
      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run ESLint
        run: npm run lint

  # ───────────────────────────────────────────────────────────────────────────
  # 2. TypeScript type-check
  # ───────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run tsc --noEmit
        run: npm run typecheck

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Unit tests + coverage
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # 4. JS bundle size check
  #    Warns (non-blocking) if the production Metro bundle exceeds 2 MB.
  #    Adjust BUDGET_BYTES below to tighten the gate when the app matures.
  # ───────────────────────────────────────────────────────────────────────────
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on PRs — informational, not a hard gate.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Export Metro bundle (hermes, android baseline)
        # expo export --platform android produces a Hermes-compiled JS bundle
        # under dist/. We measure that as a proxy for the binary JS size.
        run: |
          npx expo export --platform android --output-dir /tmp/mobile-bundle 2>/dev/null || true

      - name: Check bundle size
        run: |
          BUDGET_BYTES=2097152   # 2 MB
          BUNDLE_FILE=$(find /tmp/mobile-bundle -name "*.js" | head -1)

          if [ -z "$BUNDLE_FILE" ]; then
            echo "::warning::Could not locate JS bundle — skipping size check"
            exit 0
          fi

          SIZE=$(stat -c%s "$BUNDLE_FILE")
          SIZE_KB=$(echo "scale=1; $SIZE / 1024" | bc)
          echo "JS bundle size: ${SIZE_KB} KB (${SIZE} bytes)"

          if [ "$SIZE" -gt "$BUDGET_BYTES" ]; then
            echo "::warning file=$BUNDLE_FILE::JS bundle is ${SIZE_KB} KB — exceeds 2 MB budget. Consider lazy-loading screens."
          else
            echo "✅ Bundle ${SIZE_KB} KB is within the 2 MB budget."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 5. EAS Build — iOS (Simulator preview, no code-signing required)
  #    Produces an .ipa / simulator archive downloadable from the Actions tab.
  # ───────────────────────────────────────────────────────────────────────────
  eas-build-ios:
    name: EAS Build — iOS
    runs-on: ubuntu-latest
    # Push runs block on the real EAS build (--wait), which can take a while.
    timeout-minutes: 60
    # Only run on pushes to main or when the PR label "build" is present.
    # This keeps the workflow fast on every PR while still producing artifacts
    # on merge.  Remove the condition to build on every PR (costs more EAS minutes).
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      # SR-212: no `|| true` — a failed submission fails the job immediately.
      # On push (merge to main) we `--wait` so the job blocks on the real native
      # build result; on label-gated PRs we submit `--no-wait` for fast feedback
      # and rely on the nightly verify-eas-builds job to catch regressions.
      - name: Build iOS preview (no signing)
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            WAIT_FLAGS="--wait"
          else
            WAIT_FLAGS="--no-wait"
          fi

          eas build \
            --platform ios \
            --profile preview \
            --non-interactive \
            $WAIT_FLAGS \
            --json > "$RUNNER_TEMP/eas-ios-build.json"

          echo "--- EAS response ---"
          cat "$RUNNER_TEMP/eas-ios-build.json"

          BUILD_ID=$(jq -r '.[0].id // .id // empty' "$RUNNER_TEMP/eas-ios-build.json")
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

          # `eas build --wait` already exits non-zero on a failed build; assert
          # the reported status explicitly too so a schema change can't mask it.
          if [ "${{ github.event_name }}" = "push" ]; then
            STATUS=$(jq -r '.[0].status // .status // empty' "$RUNNER_TEMP/eas-ios-build.json")
            echo "EAS iOS build status: $STATUS"
            if [ "$STATUS" != "FINISHED" ]; then
              echo "::error::EAS iOS build did not finish successfully (status: ${STATUS:-unknown})"
              exit 1
            fi
          else
            echo "EAS iOS build submitted ($BUILD_ID). Nightly verify job will confirm completion."
          fi

      - name: Download iOS build artifact
        if: github.event_name == 'push' && steps.build.outputs.build_id != ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build:download --id "${{ steps.build.outputs.build_id }}" --output ./ios-build.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && steps.build.outputs.build_id != ''
        with:
          name: ios-preview-build
          path: mobile/ios-build.tar.gz
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # 6. EAS Build — Android (APK preview)
  # ───────────────────────────────────────────────────────────────────────────
  eas-build-android:
    name: EAS Build — Android
    runs-on: ubuntu-latest
    # Push runs block on the real EAS build (--wait), which can take a while.
    timeout-minutes: 60
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      # SR-212: no `|| true` — a failed submission fails the job immediately.
      # On push (merge to main) we `--wait` so the job blocks on the real native
      # build result; on label-gated PRs we submit `--no-wait` for fast feedback
      # and rely on the nightly verify-eas-builds job to catch regressions.
      - name: Build Android preview (APK)
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            WAIT_FLAGS="--wait"
          else
            WAIT_FLAGS="--no-wait"
          fi

          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            $WAIT_FLAGS \
            --json > "$RUNNER_TEMP/eas-android-build.json"

          echo "--- EAS response ---"
          cat "$RUNNER_TEMP/eas-android-build.json"

          BUILD_ID=$(jq -r '.[0].id // .id // empty' "$RUNNER_TEMP/eas-android-build.json")
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            STATUS=$(jq -r '.[0].status // .status // empty' "$RUNNER_TEMP/eas-android-build.json")
            echo "EAS Android build status: $STATUS"
            if [ "$STATUS" != "FINISHED" ]; then
              echo "::error::EAS Android build did not finish successfully (status: ${STATUS:-unknown})"
              exit 1
            fi
          else
            echo "EAS Android build submitted ($BUILD_ID). Nightly verify job will confirm completion."
          fi

      - name: Download Android build artifact
        if: github.event_name == 'push' && steps.build.outputs.build_id != ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build:download --id "${{ steps.build.outputs.build_id }}" --output ./android-build.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && steps.build.outputs.build_id != ''
        with:
          name: android-preview-build
          path: mobile/android-build.apk
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # 6b. Nightly EAS build verification (SR-212)
  #     Confirms the most recent EAS build for each platform finished
  #     successfully. Catches native-build-config regressions that slipped
  #     through the --no-wait PR submissions.
  # ───────────────────────────────────────────────────────────────────────────
  verify-eas-builds:
    name: Verify latest EAS builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Check most recent ${{ matrix.platform }} build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          eas build:list \
            --platform ${{ matrix.platform }} \
            --limit 1 \
            --non-interactive \
            --json > "$RUNNER_TEMP/latest.json"

          cat "$RUNNER_TEMP/latest.json"

          COUNT=$(jq 'length' "$RUNNER_TEMP/latest.json")
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No EAS builds found for ${{ matrix.platform }} — nothing to verify."
            exit 0
          fi

          STATUS=$(jq -r '.[0].status' "$RUNNER_TEMP/latest.json")
          CREATED=$(jq -r '.[0].createdAt // "unknown"' "$RUNNER_TEMP/latest.json")
          echo "Latest ${{ matrix.platform }} build: $STATUS (created $CREATED)"

          case "$STATUS" in
            FINISHED)
              echo "✅ Latest ${{ matrix.platform }} EAS build is healthy." ;;
            NEW|IN_QUEUE|IN_PROGRESS|PENDING_CANCEL)
              echo "::warning::Latest ${{ matrix.platform }} build is still $STATUS — will re-check tomorrow." ;;
            *)
              echo "::error::Latest ${{ matrix.platform }} EAS build is in state '$STATUS' — native build config may be broken."
              exit 1 ;;
          esac

  # ───────────────────────────────────────────────────────────────────────────
  # 7. Summary gate — required status check for branch protection
  # ───────────────────────────────────────────────────────────────────────────
  mobile-ci:
    name: Mobile CI
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
      - eas-build-ios
      - eas-build-android
    # Always run so we get a clear pass/fail even if a dependency was skipped.
    if: always()
    steps:
      - name: Check required jobs
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "❌ Mobile CI failed"
              exit 1
            fi
          done
          echo "✅ Mobile CI passed"
