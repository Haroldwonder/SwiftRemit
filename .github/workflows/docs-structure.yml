name: Docs structure check

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**'
      - 'scripts/check-root-markdown.sh'
      - 'scripts/check-doc-h1.sh'
  pull_request:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**'
      - 'scripts/check-root-markdown.sh'
      - 'scripts/check-doc-h1.sh'

jobs:
  root-markdown:
    name: Root markdown allowlist (SR-115)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce root-level markdown allowlist
        run: bash scripts/check-root-markdown.sh

  single-h1:
    name: One H1 per docs file (SR-219)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs/ for accidentally concatenated documents
        run: bash scripts/check-doc-h1.sh
