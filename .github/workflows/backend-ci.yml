name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swiftremit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swiftremit_test
        run: psql $DATABASE_URL -f migrations/webhook_schema.sql

      # ── Run tests + collect coverage ────────────────────────────────────────
      # vitest.config.ts enforces the threshold values declared under
      # coverage.thresholds — the command exits non-zero if any threshold
      # is missed, which fails the job automatically.
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swiftremit_test
          NODE_ENV: test
        run: npm run test:coverage -- --reporter=verbose

      # ── Explicit threshold gate (belt-and-suspenders) ────────────────────────
      # Parses the machine-readable json-summary produced by @vitest/coverage-v8
      # and fails the job with a clear message if any metric is below threshold.
      # This step runs even when the vitest command itself exits 0 (e.g. if a
      # future config change accidentally disables threshold enforcement).
      - name: Enforce coverage thresholds
        if: always()
        shell: bash
        run: |
          SUMMARY=coverage/coverage-summary.json
          if [ ! -f "$SUMMARY" ]; then
            echo "::error::Coverage summary not found at $SUMMARY — did the test step run?"
            exit 1
          fi

          # Thresholds (must match vitest.config.ts)
          LINE_THRESHOLD=60
          FUNC_THRESHOLD=60
          BRANCH_THRESHOLD=55
          STMT_THRESHOLD=60

          LINES=$(node -e "const s=require('./$SUMMARY').total; console.log(s.lines.pct)")
          FUNCS=$(node -e "const s=require('./$SUMMARY').total; console.log(s.functions.pct)")
          BRANCHES=$(node -e "const s=require('./$SUMMARY').total; console.log(s.branches.pct)")
          STMTS=$(node -e "const s=require('./$SUMMARY').total; console.log(s.statements.pct)")

          echo "Coverage → lines: ${LINES}%  functions: ${FUNCS}%  branches: ${BRANCHES}%  statements: ${STMTS}%"

          FAIL=0
          (( $(echo "$LINES < $LINE_THRESHOLD"   | bc -l) )) && echo "::error::Lines coverage ${LINES}% is below threshold ${LINE_THRESHOLD}%"     && FAIL=1
          (( $(echo "$FUNCS < $FUNC_THRESHOLD"   | bc -l) )) && echo "::error::Functions coverage ${FUNCS}% is below threshold ${FUNC_THRESHOLD}%"  && FAIL=1
          (( $(echo "$BRANCHES < $BRANCH_THRESHOLD" | bc -l) )) && echo "::error::Branches coverage ${BRANCHES}% is below threshold ${BRANCH_THRESHOLD}%" && FAIL=1
          (( $(echo "$STMTS < $STMT_THRESHOLD"   | bc -l) )) && echo "::error::Statements coverage ${STMTS}% is below threshold ${STMT_THRESHOLD}%" && FAIL=1

          exit $FAIL

      # ── Artifacts ────────────────────────────────────────────────────────────
      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

      # ── PR comment with coverage summary ─────────────────────────────────────
      - name: Post coverage summary as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: backend/coverage/coverage-summary.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: Backend Coverage
