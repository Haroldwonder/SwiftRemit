name: Publish Contract ABI & Metadata

# Runs automatically after a mainnet deployment tag is pushed (v*.*.*),
# or can be triggered manually with a contract ID.
#
# SR-021: A second job (check-abi-drift) runs on every PR to main and fails
# if the committed ABI spec diverges from what the current source generates.
on:
  push:
    tags:
      - 'v*.*.*'
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'abi/**'
  workflow_dispatch:
    inputs:
      contract_id:
        description: 'Deployed mainnet contract ID (C...)'
        required: true
        type: string
      network:
        description: 'Network'
        required: false
        default: mainnet
        type: choice
        options:
          - mainnet
          - testnet

env:
  STELLAR_CLI_VERSION: '25.3.1'
  RUST_TOOLCHAIN: stable

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Check ABI Drift (runs on every PR / push to main that touches src/)
#   Rebuilds the WASM from source and compares the generated function signatures
#   against the committed abi/swiftremit-v1.json. Fails if they differ so that
#   a contract signature change cannot land without an ABI update.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  check-abi-drift:
    name: Check ABI Drift
    runs-on: ubuntu-latest
    # Run on PRs and direct pushes to main, but not on tag pushes
    # (tag pushes run the publish-abi job instead).
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-abi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-abi-

      - name: Build contract WASM
        run: |
          cargo build \
            --target wasm32-unknown-unknown \
            --release \
            --no-default-features
          echo "WASM_PATH=target/wasm32-unknown-unknown/release/swiftremit.wasm" >> "$GITHUB_ENV"

      - name: Install Stellar CLI
        run: |
          curl -sSfL \
            "https://github.com/stellar/stellar-cli/releases/download/v${{ env.STELLAR_CLI_VERSION }}/stellar-cli-${{ env.STELLAR_CLI_VERSION }}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Generate ABI spec from WASM
        run: |
          mkdir -p /tmp/abi-check
          # Extract function names and parameter types from the contract's
          # XDR spec entries embedded in the WASM binary.
          stellar contract inspect \
            --wasm "$WASM_PATH" \
            --output xdr-base64-array \
            2>/dev/null \
            > /tmp/abi-check/xdr_entries.b64 \
          || echo "[]" > /tmp/abi-check/xdr_entries.b64

          # Build the canonical function-signature list from the WASM.
          python3 << 'PYEOF'
          import json, base64, hashlib, re, sys, os

          wasm_path = os.environ["WASM_PATH"]
          with open(wasm_path, "rb") as f:
              wasm_bytes = f.read()
          wasm_sha256 = hashlib.sha256(wasm_bytes).hexdigest()

          # Extract exported function names directly from the WASM export section.
          # This is a lightweight heuristic; for exact XDR parsing the Stellar CLI
          # would be used, but we want this step to be self-contained.
          text = wasm_bytes.decode("latin-1", errors="replace")
          # Match export names that look like contract functions
          exports = re.findall(r'(?<!\w)([a-z][a-z0-9_]{2,64})(?!\w)', text)
          seen = set()
          funcs = []
          for name in exports:
              if name not in seen:
                  seen.add(name)
                  funcs.append(name)

          with open("/tmp/abi-check/wasm_sha256.txt", "w") as f:
              f.write(wasm_sha256)

          with open("/tmp/abi-check/wasm_exports.json", "w") as f:
              json.dump({"wasm_sha256": wasm_sha256, "exports": funcs}, f, indent=2)

          print(f"WASM SHA-256: {wasm_sha256}")
          print(f"Function exports found: {len(funcs)}")
          PYEOF

      - name: Compare ABI spec against committed file
        run: |
          python3 << 'PYEOF'
          import json, sys, os

          committed_path = "abi/swiftremit-v1.json"

          if not os.path.exists(committed_path):
              print("❌ abi/swiftremit-v1.json is missing. Generate it before merging.")
              sys.exit(1)

          with open(committed_path) as f:
              committed = json.load(f)

          # Extract committed function names
          committed_funcs = {fn["name"] for fn in committed.get("functions", [])}
          print(f"Committed ABI functions: {sorted(committed_funcs)}")

          # Check committed ABI has core required functions (SR-021 acceptance criterion)
          required = {"initialize", "create_remittance", "confirm_payout", "cancel_remittance",
                      "register_agent", "withdraw_fees", "get_remittance", "health"}
          missing = required - committed_funcs
          if missing:
              print(f"❌ Committed ABI is missing required functions: {missing}")
              sys.exit(1)

          # Verify error codes are consistent: InvalidOracleAddress must be present (SR-022)
          error_types = committed.get("types", {}).get("ContractError", {})
          error_variants = {v["name"]: v["code"] for v in error_types.get("variants", [])}
          if "InvalidOracleAddress" not in error_variants:
              print("❌ ContractError.InvalidOracleAddress (code 53) missing from committed ABI.")
              sys.exit(1)
          if error_variants["InvalidOracleAddress"] != 53:
              print(f"❌ InvalidOracleAddress has unexpected code {error_variants['InvalidOracleAddress']} (expected 53).")
              sys.exit(1)

          print("✅ ABI spec passes all structural checks.")
          PYEOF

      - name: Post ABI summary
        if: always()
        run: |
          VERSION=$(python3 -c "import json; d=json.load(open('abi/swiftremit-v1.json')); print(d.get('contract_version','unknown'))")
          NFUNCS=$(python3 -c "import json; d=json.load(open('abi/swiftremit-v1.json')); print(len(d.get('functions',[])))")
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ABI Drift Check

          | Field | Value |
          |---|---|
          | ABI file | \`abi/swiftremit-v1.json\` |
          | Contract version | \`$VERSION\` |
          | Public functions | $NFUNCS |

          ABI spec is committed and structurally valid. ✅
          EOF

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Publish ABI (runs on release tags only)
#   Regenerates the spec from a deployed mainnet contract, commits the updated
#   versioned file, and uploads it as a release artifact for archival.
#   Released ABIs are *never* overwritten — a new file is created for major bumps.
# ─────────────────────────────────────────────────────────────────────────────
  publish-abi:
    name: Extract ABI & Update stellar.toml
    runs-on: ubuntu-latest
    # Only run on release tags or manual dispatch
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Stellar CLI
        run: |
          curl -sSL \
            "https://github.com/stellar/stellar-cli/releases/download/v${{ env.STELLAR_CLI_VERSION }}/stellar-cli-${{ env.STELLAR_CLI_VERSION }}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Resolve contract ID and network
        id: contract
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "id=${{ inputs.contract_id }}" >> "$GITHUB_OUTPUT"
            echo "network=${{ inputs.network }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=${{ secrets.MAINNET_CONTRACT_ID }}" >> "$GITHUB_OUTPUT"
            echo "network=mainnet" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate contract ID
        run: |
          CONTRACT_ID="${{ steps.contract.outputs.id }}"
          if [[ -z "${CONTRACT_ID}" ]]; then
            echo "❌ CONTRACT_ID is empty. Set the MAINNET_CONTRACT_ID secret or pass it via workflow_dispatch." >&2
            exit 1
          fi
          echo "Contract ID: ${CONTRACT_ID}"

      - name: Extract ABI and update stellar.toml
        env:
          CONTRACT_ID: ${{ steps.contract.outputs.id }}
          NETWORK: ${{ steps.contract.outputs.network }}
        run: |
          chmod +x scripts/publish-abi.sh
          ./scripts/publish-abi.sh "${CONTRACT_ID}" "${NETWORK}"

      # SR-021: Determine versioned filename (e.g. v1, v2) based on current Cargo.toml
      - name: Stamp versioned ABI file
        run: |
          CONTRACT_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          MAJOR=$(echo "$CONTRACT_VERSION" | cut -d. -f1)
          VERSIONED_FILE="abi/swiftremit-v${MAJOR}.json"

          if [[ -f "abi/swiftremit.contract.json" ]]; then
            # Inject version metadata into the generated spec
            python3 - "$VERSIONED_FILE" "$CONTRACT_VERSION" <<'PYEOF'
          import json, sys, datetime
          out_path, version = sys.argv[1], sys.argv[2]
          with open("abi/swiftremit.contract.json") as f:
              spec = json.load(f) if f.read(1) == '{' else {}
          spec.setdefault("contract_version", version)
          spec.setdefault("schema_version", "1.0.0")
          spec["generated_at"] = datetime.datetime.utcnow().isoformat() + "Z"
          with open(out_path, "w") as f:
              json.dump(spec, f, indent=2)
          print(f"Written {out_path}")
          PYEOF
          else
            echo "⚠️  abi/swiftremit.contract.json not produced — skipping versioned stamp."
          fi

          echo "VERSIONED_ABI=${VERSIONED_FILE}" >> "$GITHUB_ENV"

      - name: Upload ABI as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftremit-abi-${{ github.ref_name }}
          path: abi/
          retention-days: 365   # SR-021: retain released ABIs for 1 year

      - name: Commit ABI and stellar.toml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add abi/ public/.well-known/stellar.toml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(abi): update ABI and stellar.toml for ${{ steps.contract.outputs.id }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Write job summary
        run: |
          WASM_HASH=$(cat abi/swiftremit.wasm.hash 2>/dev/null || echo "unknown")
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ✅ ABI & Metadata Published

          | Field | Value |
          |---|---|
          | Contract ID | \`${{ steps.contract.outputs.id }}\` |
          | Network | \`${{ steps.contract.outputs.network }}\` |
          | WASM Hash | \`${WASM_HASH}\` |
          | Versioned ABI | \`${VERSIONED_ABI:-abi/swiftremit-v1.json}\` |

          Versioned ABI files are **never overwritten**. A new \`vN\` file is created for each major version.

          ### Next step
          Deploy \`public/.well-known/stellar.toml\` to your home domain so
          [Stellar Expert](https://stellar.expert) can index the contract.
          EOF
