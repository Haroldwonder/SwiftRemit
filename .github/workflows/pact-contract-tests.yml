name: Pact Contract Tests (SR-062)

# SR-216: consumer pacts and provider-verification results are published to a
# Pact Broker when one is configured (repository variable PACT_BROKER_BASE_URL +
# secret PACT_BROKER_TOKEN). The broker is then the source of truth that the
# `can-i-deploy` gate in deploy-staging.yml / deploy-mainnet.yml queries.
#
# With no broker configured every broker step is skipped and the workflow falls
# back to uploading pact files as CI artifacts (and committing them to pacts/ on
# push to main), preserving the pre-broker behaviour.
#
# To stand up a self-hosted broker locally:  docker compose --profile pact-broker up
# See docs/PACT_BROKER.md.

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "frontend/src/**"
      - "sdk/src/**"
      - "mobile/src/**"
      - "api/src/**"
      - "frontend/package.json"
      - "sdk/package.json"
      - "mobile/package.json"
      - "api/package.json"
      - ".github/workflows/pact-contract-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "sdk/src/**"
      - "mobile/src/**"
      - "api/src/**"
      - "frontend/package.json"
      - "sdk/package.json"
      - "mobile/package.json"
      - "api/package.json"
      - ".github/workflows/pact-contract-tests.yml"

jobs:
  # ── Step 1a: Frontend consumer pacts ───────────────────────────────────────
  consumer-frontend:
    name: "Pact consumer — Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
        working-directory: .
      - name: Generate Frontend pact
        run: npm run test:pact
      - name: Upload frontend pact
        uses: actions/upload-artifact@v4
        with:
          name: pact-frontend
          path: pacts/SwiftRemitFrontend-SwiftRemitAPI.json
          retention-days: 7
      - name: Publish Frontend pact to broker
        if: ${{ vars.PACT_BROKER_BASE_URL != '' }}
        working-directory: .
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: bash scripts/pact-publish.sh SwiftRemitFrontend

  # ── Step 1b: SDK consumer pacts ────────────────────────────────────────────
  consumer-sdk:
    name: "Pact consumer — SDK"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - name: Generate SDK pact
        run: npm run test:pact
      - name: Upload SDK pact
        uses: actions/upload-artifact@v4
        with:
          name: pact-sdk
          path: pacts/SwiftRemitSDK-SwiftRemitAPI.json
          retention-days: 7
      - name: Publish SDK pact to broker
        if: ${{ vars.PACT_BROKER_BASE_URL != '' }}
        working-directory: .
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: bash scripts/pact-publish.sh SwiftRemitSDK

  # ── Step 1c: Mobile consumer pacts ─────────────────────────────────────────
  consumer-mobile:
    name: "Pact consumer — Mobile"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - name: Generate Mobile pact
        run: npm run test:pact
      - name: Upload mobile pact
        uses: actions/upload-artifact@v4
        with:
          name: pact-mobile
          path: pacts/SwiftRemitMobile-SwiftRemitAPI.json
          retention-days: 7
      - name: Publish Mobile pact to broker
        if: ${{ vars.PACT_BROKER_BASE_URL != '' }}
        working-directory: .
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: bash scripts/pact-publish.sh SwiftRemitMobile

  # ── Step 1d: API→Backend consumer pact ─────────────────────────────────────
  consumer-api-backend:
    name: "Pact consumer — API→Backend (internal)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

  # ── Step 2: Provider verification — API satisfies all consumer pacts ────────
  provider-verification:
    name: "Pact provider verification — SwiftRemitAPI"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - consumer-frontend
      - consumer-sdk
      - consumer-mobile
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .

      - name: Download all consumer pacts
        uses: actions/download-artifact@v4
        with:
          pattern: pact-*
          path: pacts/
          merge-multiple: true

      - name: Run provider verification (all consumers)
        env:
          JWT_SECRET: ci-pact-verification-secret
          CURRENCY_CONFIG_PATH: ./config/currencies.json
          ADMIN_API_KEY: pact-admin-key
          ANCHOR_TOML_VALIDATION_DISABLED: "true"
          # SR-216: when set, pacts are pulled from the broker and the
          # verification result is published back, keyed by this commit SHA.
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          PACT_PROVIDER_VERSION: ${{ github.sha }}
          PACT_PROVIDER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npm run test:pact

      - name: Publish step summary
        if: always()
        run: |
          echo "## Pact Provider Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ vars.PACT_BROKER_BASE_URL }}" ]; then
            echo "Source: Pact Broker (\`${{ vars.PACT_BROKER_BASE_URL }}\`) — results published for SHA \`${{ github.sha }}\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "Source: downloaded CI artifacts (no broker configured)." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Consumer | Contract file |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------------|" >> $GITHUB_STEP_SUMMARY
          echo "| SwiftRemitFrontend | SwiftRemitFrontend-SwiftRemitAPI.json |" >> $GITHUB_STEP_SUMMARY
          echo "| SwiftRemitSDK      | SwiftRemitSDK-SwiftRemitAPI.json      |" >> $GITHUB_STEP_SUMMARY
          echo "| SwiftRemitMobile   | SwiftRemitMobile-SwiftRemitAPI.json   |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A failure here means a breaking API change was introduced." >> $GITHUB_STEP_SUMMARY

  # ── Step 3 (legacy): Commit generated pact files back to the repo ──────────
  # Retired once a Pact Broker is configured (SR-216): the broker becomes the
  # source of truth, so this job only runs while PACT_BROKER_BASE_URL is unset.
  publish-pacts:
    name: "Commit pact files to pacts/ directory (no-broker fallback)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: provider-verification
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.PACT_BROKER_BASE_URL == ''
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all consumer pacts
        uses: actions/download-artifact@v4
        with:
          pattern: pact-*
          path: pacts/
          merge-multiple: true

      - name: Commit updated pact files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pacts/
          if git diff --cached --quiet; then
            echo "No pact changes to commit."
          else
            git commit -m "chore(pacts): update generated pact files [skip ci]"
            git push
          fi
