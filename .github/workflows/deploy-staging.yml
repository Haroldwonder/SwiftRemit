name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: "Skip smoke tests (useful for infrastructure-only changes)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: staging-deploy
  cancel-in-progress: false   # Never cancel an in-flight staging deploy

permissions:
  contents: read
  deployments: write

jobs:
  # ── Build and push Docker images ──────────────────────────────────────────
  build-images:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:staging
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:staging
            ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:staging
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Pact can-i-deploy gate (SR-216) ──────────────────────────────────────
  # Asks the Pact Broker whether SwiftRemitAPI at this SHA has verified pacts for
  # every consumer currently in the staging environment. Inert (passes with a
  # warning) until the PACT_BROKER_BASE_URL repository variable is set.
  pact-can-i-deploy:
    name: Pact — can I deploy to staging?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: can-i-deploy
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: bash scripts/pact-can-i-deploy.sh staging "${{ github.sha }}"

  # ── Deploy to staging VM via SSH ──────────────────────────────────────────
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [build-images, pact-can-i-deploy]
    environment:
      name: staging
      url: ${{ vars.STAGING_API_URL }}
    outputs:
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: staging
          ref: ${{ github.sha }}

      - name: Copy compose file to staging server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          source: "docker-compose.yml,docker-compose.override.yml,.env.testnet"
          target: "~/swiftremit"

      # Record what is running *before* we overwrite it, so the rollback job has
      # a last-known-good target to redeploy if smoke tests fail (SR-209).
      - name: Capture currently-deployed image tags (rollback point)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ~/swiftremit
            mkdir -p rollback
            tmp=rollback/previous-images.env.tmp
            : > "$tmp"
            for svc in backend api frontend; do
              cid=$(docker compose ps -q "$svc" 2>/dev/null | head -n1 || true)
              if [ -n "${cid:-}" ]; then
                img=$(docker inspect --format '{{.Config.Image}}' "$cid" 2>/dev/null || true)
                if [ -n "${img:-}" ]; then
                  echo "${svc}_image=${img}" >> "$tmp"
                fi
              fi
            done
            if [ -s "$tmp" ]; then
              mv "$tmp" rollback/previous-images.env
              echo "Recorded rollback point:"
              cat rollback/previous-images.env
            else
              rm -f "$tmp"
              echo "No running stack found — first deploy, no rollback point recorded."
            fi

      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ~/swiftremit

            # Log into GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Export image tags so compose uses the freshly pushed images
            export BACKEND_IMAGE=ghcr.io/${{ github.repository }}/backend:${{ needs.build-images.outputs.sha_short }}
            export API_IMAGE=ghcr.io/${{ github.repository }}/api:${{ needs.build-images.outputs.sha_short }}
            export FRONTEND_IMAGE=ghcr.io/${{ github.repository }}/frontend:${{ needs.build-images.outputs.sha_short }}

            # Source testnet env overrides then deploy
            set -a; source .env.testnet; set +a

            docker compose pull
            docker compose up -d --remove-orphans

            # Give services a moment to start before smoke tests run
            sleep 10
            docker compose ps

      # NOTE: deployment status is *not* marked success here — it is finalised by
      # the `finalize` job only after smoke tests pass, or by the `rollback` job
      # if they fail, so the deployment history reflects what is actually running.
      - name: Mark deployment failure (deploy step failed)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure

  # ── Smoke tests against the live staging environment ──────────────────────
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [build-images, deploy]
    if: ${{ github.event.inputs.skip_smoke != 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_BACKEND_URL: ${{ vars.STAGING_BACKEND_URL }}
        run: bash scripts/smoke-test-staging.sh

      - name: Smoke test summary
        if: always()
        run: |
          echo "### Smoke test results" >> $GITHUB_STEP_SUMMARY
          echo "- API URL: \`${{ vars.STAGING_API_URL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Backend URL: \`${{ vars.STAGING_BACKEND_URL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ needs.build-images.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY

  # ── Finalise a healthy deploy ─────────────────────────────────────────────
  finalize:
    name: Finalize deployment status
    runs-on: ubuntu-latest
    needs: [deploy, smoke-tests]
    if: ${{ always() && needs.deploy.result == 'success' && needs.smoke-tests.result != 'failure' && needs.smoke-tests.result != 'cancelled' }}

    steps:
      - name: Mark deployment success
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ needs.deploy.outputs.deployment_id }}
          state: success
          environment-url: ${{ vars.STAGING_API_URL }}

  # ── Automated rollback when smoke tests fail (SR-209) ─────────────────────
  rollback:
    name: Roll back failed deploy
    runs-on: ubuntu-latest
    needs: [build-images, deploy, smoke-tests]
    if: ${{ always() && needs.deploy.result == 'success' && needs.smoke-tests.result == 'failure' }}

    steps:
      - uses: actions/checkout@v4

      - name: Re-deploy last-known-good images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ~/swiftremit

            if [ ! -s rollback/previous-images.env ]; then
              echo "::error::No rollback point was recorded (first deploy?). Staging is running a failed build — manual intervention required."
              exit 1
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            set -a
            source .env.testnet
            source rollback/previous-images.env
            set +a

            export BACKEND_IMAGE="${backend_image:?missing backend_image in rollback point}"
            export API_IMAGE="${api_image:?missing api_image in rollback point}"
            export FRONTEND_IMAGE="${frontend_image:?missing frontend_image in rollback point}"

            echo "Rolling staging back to:"
            echo "  BACKEND_IMAGE=$BACKEND_IMAGE"
            echo "  API_IMAGE=$API_IMAGE"
            echo "  FRONTEND_IMAGE=$FRONTEND_IMAGE"

            docker compose pull
            docker compose up -d --remove-orphans

            sleep 10
            docker compose ps

      - name: Verify rollback with smoke tests
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_BACKEND_URL: ${{ vars.STAGING_BACKEND_URL }}
        run: bash scripts/smoke-test-staging.sh

      - name: Mark deployment failure (after rollback)
        if: always()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ needs.deploy.outputs.deployment_id }}
          state: failure

      - name: Rollback summary
        if: always()
        run: |
          echo "### ⚠️ Staging deploy rolled back" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Smoke tests failed against \`${{ needs.build-images.outputs.sha_short }}\`." >> $GITHUB_STEP_SUMMARY
          echo "Staging was redeployed with the previously-running images (see the" >> $GITHUB_STEP_SUMMARY
          echo "rollback job log for the exact tags). The GitHub deployment is marked failed." >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**The rollback itself did not fully succeed — page the on-call engineer.**" >> $GITHUB_STEP_SUMMARY
          fi
