name: Soroban Contract CI
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/contract-ci*.yml'
      - '.github/actions/setup-rust/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/contract-ci*.yml'
      - '.github/actions/setup-rust/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: contract-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - run: cargo test --verbose
      - run: cargo test --features legacy-tests --verbose

  build-wasm:
    name: cargo build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown --release
      - name: Report WASM size
        run: |
          WASM=target/wasm32-unknown-unknown/release/swiftremit.wasm
          SIZE=$(stat -c%s "$WASM")
          echo "WASM binary: $((SIZE / 1024)) KB ($SIZE bytes)"
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftremit-wasm
          path: target/wasm32-unknown-unknown/release/swiftremit.wasm
          retention-days: 7

  readme-functions:
    name: README function coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_readme_functions.sh

  contract-ci:
    name: Contract CI Status
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, build-wasm, readme-functions]
    if: always()
    steps:
      - name: Check results
        run: |
          results=("${{ needs.fmt.result }}" "${{ needs.clippy.result }}" "${{ needs.test.result }}" "${{ needs.build-wasm.result }}" "${{ needs.readme-functions.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "❌ Contract CI failed"
              exit 1
            fi
          done
          echo "✅ Contract CI passed"
