name: Docs accuracy

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check-markdown-links.js'

jobs:
  markdown-links:
    name: Check internal markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: node scripts/check-markdown-links.js
