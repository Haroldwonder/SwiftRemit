name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - backend
          - frontend
          - api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm production dependencies (fail on high/critical)
        working-directory: ${{ matrix.workspace }}
        run: npm audit --audit-level=high --omit=dev

  cargo-audit-and-deny:
    name: cargo audit & cargo deny (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Generate Cargo.lock for audit
        run: cargo generate-lockfile

      - name: Audit Rust dependencies (cargo audit)
        run: cargo audit

      - name: Check Rust licenses and advisories (cargo deny)
        run: cargo deny check
