name: Setup Node.js
description: Configure Node.js with npm caching

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '20'
  cache-dependency-path:
    description: Path to package-lock.json or equivalent
    required: false
    default: ''
  working-directory:
    description: Working directory for npm ci
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
